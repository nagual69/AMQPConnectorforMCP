name: Release

# A version tag (vX.Y.Z) builds, tests and packs the package, then publishes a GitHub Release
# with the packed tarball attached. It does NOT publish to npm: that is a separate, deliberate
# step (publish-npm.yml), because an npm release cannot be taken back and the package name is
# still an open decision (docs/REARCHITECTURE_PLAN_2026-07-28.md, D-6).
#
# The attached tarball is what consumers can pin instead of a git dependency, e.g.
#   "amqp-mcp-transport": "https://github.com/VibeForge-Systems/amqp-mcp-transport/releases/download/v1.2.0/amqp-mcp-transport-1.2.0.tgz"
# which npm installs without running a build and records with an integrity hash it checks.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "npm"

      - name: Tag must match package.json version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build project
        run: npm run build

      - name: Pack
        run: |
          npm pack
          sha256sum "amqp-mcp-transport-${VERSION}.tgz" > "amqp-mcp-transport-${VERSION}.tgz.sha256"
          cat "amqp-mcp-transport-${VERSION}.tgz.sha256"

      - name: Release notes from CHANGELOG
        run: |
          awk -v v="${VERSION}" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no section for ${VERSION}"
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            amqp-mcp-transport-${{ env.VERSION }}.tgz
            amqp-mcp-transport-${{ env.VERSION }}.tgz.sha256
